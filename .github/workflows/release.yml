name: Release

# Builds the one `foiley` binary (command line + Foiley Studio) per platform.
# Push a tag vX.Y.Z (equal to the workspace version) to publish a GitHub
# release once every build and smoke test passes; a version with a hyphen
# (0.1.0-dev.1) is published as a pre-release.  Run it by hand
# (workflow_dispatch) to only build the archives.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # run manifests record the commit (crates/core/build.rs); the Linux
  # containers may have no usable .git
  FOILEY_GIT_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux_2_28 is AlmaLinux 8 (glibc 2.28): the binary runs on
          # RHEL/Rocky 8+, Ubuntu 20.04+, Debian 11+.  The GUI libraries are
          # loaded at run time, so the build needs none of them.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            cpu: x86-64-v2
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            cpu: generic
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cpu: x86-64-v2
            # static C runtime: no Visual C++ redistributable needed
            extra: -C target-feature=+crt-static
          - target: aarch64-apple-darwin
            os: macos-latest
            cpu: apple-m1
    env:
      # Replaces .cargo/config.toml's target-cpu=native, which would tie the
      # binary to the runner's CPU.  src/simd.rs picks AVX2 at run time.
      RUSTFLAGS: -C target-cpu=${{ matrix.cpu }} ${{ matrix.extra }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --profile dist --locked -p foiley-cli

      - name: Smoke test
        run: |
          exe=target/dist/foiley
          if [ "$RUNNER_OS" = Windows ]; then exe=$exe.exe; fi
          "$exe" --version
          "$exe" -q foil polar "NACA 2412" --alpha 0:4:2
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "$("$exe" --version)" != "foiley ${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version ($("$exe" --version))"
            exit 1
          fi

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; else version=dev-${GITHUB_SHA::7}; fi
          name=foiley-$version-${{ matrix.target }}
          mkdir -p "staging/$name" dist
          cp README.md LICENSE "staging/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/dist/foiley.exe "staging/$name/"
            (cd staging && 7z a -tzip "../dist/$name.zip" "$name")
          else
            cp target/dist/foiley "staging/$name/"
            tar -C staging -czf "dist/$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: foiley-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      # notes: .github/release-notes/<tag>.md if present, a downloads table,
      # then GitHub's generated list of changes
      - name: Release notes
        run: |
          v=${GITHUB_REF_NAME#v}
          notes=.github/release-notes/$GITHUB_REF_NAME.md
          { if [ -f "$notes" ]; then cat "$notes"; echo; fi
            cat <<EOF
          ## Downloads

          | platform | archive |
          |---|---|
          | Windows 10/11, x86-64 | \`foiley-$v-x86_64-pc-windows-msvc.zip\` |
          | Linux x86-64 (glibc 2.28+: RHEL/Rocky 8+, Ubuntu 20.04+, Debian 11+) | \`foiley-$v-x86_64-unknown-linux-gnu.tar.gz\` |
          | Linux aarch64 (glibc 2.28+) | \`foiley-$v-aarch64-unknown-linux-gnu.tar.gz\` |
          | macOS, Apple silicon | \`foiley-$v-aarch64-apple-darwin.tar.gz\` |

          Each archive holds one \`foiley\` binary (the command line and Foiley Studio), README.md and LICENSE. \`SHA256SUMS\` lists the checksums.

          * **Windows:** unzip, then double-click \`foiley.exe\` for Foiley Studio, or run \`foiley --help\` in a terminal.
          * **Linux / macOS:** \`tar xf\` the archive, then \`./foiley studio\` or \`./foiley --help\`. The Linux binary runs on servers with no display or GUI libraries installed.
          * **macOS:** the binary is not signed; run \`xattr -d com.apple.quarantine foiley\` once.
          EOF
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $pre --title "Foiley $GITHUB_REF_NAME" --notes "$(cat release-notes.md)" --generate-notes
