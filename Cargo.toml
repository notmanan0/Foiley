[workspace]
members = [".", "crates/core", "crates/foil", "crates/plane", "crates/app", "crates/cli", "crates/gui"]
default-members = [".", "crates/core", "crates/foil", "crates/plane", "crates/app", "crates/cli", "crates/gui"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace.dependencies]
foiley = { path = "." }
foiley-core = { path = "crates/core" }
foiley-foil = { path = "crates/foil" }
foiley-plane = { path = "crates/plane" }
foiley-app = { path = "crates/app" }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
crossbeam-channel = "0.5"
clap = { version = "4.6", features = ["derive"] }
quick-xml = "0.42"
blake3 = { version = "1.8", default-features = false, features = ["std"] }
mimalloc = { version = "0.1.52", default-features = false }

[package]
name = "foiley"
version = "0.2.0"
edition = "2021"
description = "Rust port of XFoil 6.97 with multithreading and SIMD (2D engine of Foiley)"
license = "GPL-2.0-or-later"
autobins = false

[dependencies]
rayon = "1.10"

[features]
# raw-bit dump of every stored point to $RAWDUMP (finding F015; src/rawdump.rs)
rawdump = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind (not abort) so that a numerical failure inside one solve can be
# caught and reported instead of taking down the GUI or a long batch run.
panic = "unwind"
debug = 1

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.bench]
inherits = "release"

[dev-dependencies]
mimalloc = { version = "0.1.52", default-features = false }
# the root crate's own tests (tests/f015.rs) run with the raw-bit hook
foiley = { path = ".", features = ["rawdump"] }
