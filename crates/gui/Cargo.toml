[package]
name = "foiley-gui"
description = "Foiley Studio - graphical interface (a library: the `foiley` binary opens it with `foiley studio`)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["snap"]
snap = ["eframe/accesskit", "dep:egui_kittest", "dep:egui-wgpu", "dep:font8x8", "dep:image", "dep:pollster"]

[dependencies]
foiley-core.workspace = true
foiley-foil.workspace = true
foiley-plane.workspace = true
foiley-app.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_plot = "0.34"
rfd = "0.15"
egui_kittest = { version = "=0.33.3", features = ["wgpu"], optional = true }
egui-wgpu = { version = "=0.33.3", default-features = false, optional = true }
font8x8 = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "gif"], optional = true }
pollster = { version = "0.4", optional = true }

# eframe's default features are off above; winit needs a windowing backend on
# Linux or it refuses to compile ("platform not supported"). CI builds there.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["x11", "wayland"] }
