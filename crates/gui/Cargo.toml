[package]
name = "foiley-gui"
description = "Foiley Studio - graphical interface (a library: the `foiley` binary opens it with `foiley studio`)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
foiley-core.workspace = true
foiley-foil.workspace = true
foiley-plane.workspace = true
foiley-app.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_plot = "0.34"
rfd = "0.15"

# eframe's default features are off above; winit needs a windowing backend on
# Linux or it refuses to compile ("platform not supported"). CI builds there.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["x11", "wayland"] }
